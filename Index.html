<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אתר מכירות ואביזרים</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: auto; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card h3 { margin: 10px 0; color: #333; }
        .price { color: #28a745; font-weight: bold; font-size: 1.2em; }
        .admin-panel { background: #e9ecef; padding: 20px; border-radius: 8px; margin-top: 40px; border: 1px solid #ccc; }
        input, textarea, button { width: 90%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; cursor: pointer; border: none; font-size: 1em; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 חנות האביזרים שלי</h1>
    
    <!-- תצוגת המוצרים ללקוחות -->
    <div class="products-grid" id="productsContainer">
        <!-- המוצרים יתרנדרו כאן דינמית -->
    </div>

    <!-- פאנל ניהול מובנה בדף -->
    <div class="admin-panel">
        <h2>🛠️ פאנל ניהול מוצרים</h2>
        <input type="password" id="adminPassword" placeholder="הכנס סיסמת ניהול (staff+)">
        <input type="text" id="prodName" placeholder="שם האביזר/המוצר">
        <input type="number" id="prodPrice" placeholder="מחיר">
        <textarea id="prodDesc" placeholder="תיאור המוצר"></textarea>
        <button onclick="addProduct()">הוסף מוצר לחנות</button>
    </div>
</div>

<script>
    // פונקציה לטעינת המוצרים מהשרת והצגתם באתר
    async function loadProducts() {
        try {
            const res = await fetch('/api/products');
            const products = await res.json();
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            
            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                        <div class="price">${p.price} ₪</div>
                        <button onclick="alert('תכונת הרכישה תוגדר בהמשך!')">קנה עכשיו</button>
                    </div>
                `;
            });
        } catch (err) {
            console.error("שגיאה בטעינת המוצרים", err);
        }
    }

    // פונקציה לשליחת מוצר חדש לשרת
    async function addProduct() {
        const password = document.getElementById('adminPassword').value;
        const name = document.getElementById('prodName').value;
        const price = document.getElementById('prodPrice').value;
        const desc = document.getElementById('prodDesc').value;

        if (!password || !name || !price) {
            alert('נא למלא את כל שדות החובה!');
            return;
        }

        try {
            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                box: JSON.stringify({ password, name, price, desc })
            });
            
            const data = await res.json();
            
            if (data.error) {
                alert(data.error);
            } else {
                alert('המוצר נוסף בהצלחה!');
                loadProducts(); // רענון רשימת המוצרים
                // איפוס שדות
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodDesc').value = '';
            }
        } catch (err) {
            alert('שגיאה בתקשורת עם השרת');
        }
    }

    // טעינה ראשונית של המוצרים כשהאתר עולה
    loadProducts();
</script>

</body>
</html>
